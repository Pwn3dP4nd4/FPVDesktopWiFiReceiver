name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_deps:
        description: "Actualizar kepyur (y lo que fije) a lo ultimo antes de compilar"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * 1"   # lunes: comprobar que el kepyur de upstream sigue compilando

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Submodulos
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.update_deps }}" = true ]; then
            scripts/update-deps.sh
          else
            scripts/update-deps.sh --init
          fi
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config xxd qt6-base-dev \
            libusb-1.0-0-dev binutils-mipsel-linux-gnu libgl1-mesa-dev
      - run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FPVDesktopWiFiReceiver-linux-x64
          path: build/release/FPVDesktopWiFiReceiver

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make curl tar xz vim
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-libusb
      - name: Submodulos
        run: |
          git config --global --add safe.directory '*'
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.update_deps }}" = true ]; then
            scripts/update-deps.sh
          else
            scripts/update-deps.sh --init
          fi
      - name: Cache binutils mipsel
        uses: actions/cache@v4
        with:
          path: tools/mipsel-binutils
          key: mipsel-binutils-2.43.1-ucrt64-${{ hashFiles('scripts/get-mips-binutils.sh') }}
      - run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FPVDesktopWiFiReceiver-windows-x64
          path: dist/FPVDesktopWiFiReceiver

  # Al publicar una etiqueta v* (git tag v0.2.0 && git push --tags): zip descargable en GitHub Releases
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Empaquetar
        run: |
          (cd FPVDesktopWiFiReceiver-windows-x64 && zip -qr "../FPVDesktopWiFiReceiver-${GITHUB_REF_NAME}-windows-x64.zip" .)
          chmod +x FPVDesktopWiFiReceiver-linux-x64/FPVDesktopWiFiReceiver
          tar -C FPVDesktopWiFiReceiver-linux-x64 -czf "FPVDesktopWiFiReceiver-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **English** — **Windows 10/11 x64:** unzip and double-click `FPVDesktopWiFiReceiver.exe`. Install the WinUSB driver for the adapter with Zadig first ([README](https://github.com/${{ github.repository }}/blob/main/README.md#windows-1011), step 3). **Linux x64:** binary that needs the system's Qt 6 and libusb, plus the udev rule from the README.

          **Español** — **Windows 10/11 x64:** descomprime y abre `FPVDesktopWiFiReceiver.exe` con doble clic. Antes instala el driver WinUSB del adaptador con Zadig ([README](https://github.com/${{ github.repository }}/blob/main/README.es.md#windows-1011), paso 3). **Linux x64:** binario que necesita Qt 6 y libusb del sistema, y la regla udev del README.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "FPVDesktopWiFiReceiver $GITHUB_REF_NAME" --notes-file notes.md \
            FPVDesktopWiFiReceiver-*.zip FPVDesktopWiFiReceiver-*.tar.gz
