name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_deps:
        description: "Actualizar kepyur (y lo que fije) a lo ultimo antes de compilar"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * 1"   # lunes: comprobar que el kepyur de upstream sigue compilando

# El token, de solo lectura; release pide contents: write para publicar
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Submodulos
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.update_deps }}" = true ]; then
            scripts/update-deps.sh
          else
            scripts/update-deps.sh --init
          fi
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config xxd qt6-base-dev \
            qt6-tools-dev qt6-l10n-tools libusb-1.0-0-dev binutils-mipsel-linux-gnu libgl1-mesa-dev \
            libavformat-dev libavcodec-dev libavutil-dev
      - run: scripts/build.sh && scripts/package-linux.sh
      - name: Comprobar grabacion de video (FFmpeg enlazado)
        run: ldd build/release/FPVDesktopWiFiReceiver | grep -q libavcodec
      - name: Tests (senales sinteticas, sin adaptador)
        run: bash scripts/run-tests.sh
      - name: Radio sin adaptador (grabaciones sinteticas en radio_sim)
        run: bash scripts/radio-sim-test.sh
      - name: Comprobar instalacion (regla udev en /etc/udev/rules.d)
        run: |
          DESTDIR="$PWD/stage" cmake --install build/release
          find stage -type f | sort
          test -f stage/etc/udev/rules.d/60-kepyur.rules
          test -f stage/usr/local/share/applications/FPVDesktopWiFiReceiver.desktop
          test -f stage/usr/local/share/icons/hicolor/256x256/apps/FPVDesktopWiFiReceiver.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: FPVDesktopWiFiReceiver-linux-x64
          path: dist/FPVDesktopWiFiReceiver-linux

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c  # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make curl tar xz vim
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-qt6-translations
      - name: Submodulos
        run: |
          git config --global --add safe.directory '*'
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.update_deps }}" = true ]; then
            scripts/update-deps.sh
          else
            scripts/update-deps.sh --init
          fi
      - name: Cache binutils mipsel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: tools/mipsel-binutils
          key: mipsel-binutils-2.43.1-ucrt64-${{ hashFiles('scripts/get-mips-binutils.sh') }}
      - run: scripts/build.sh
      - name: Tests (senales sinteticas, sin adaptador)
        run: bash scripts/run-tests.sh
      - name: Radio sin adaptador (grabaciones sinteticas en radio_sim)
        run: bash scripts/radio-sim-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: FPVDesktopWiFiReceiver-windows-x64
          path: dist/FPVDesktopWiFiReceiver

  # Al publicar una etiqueta v* (git tag v0.2.0 && git push --tags): zip descargable en GitHub Releases
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      - name: Empaquetar
        run: |
          (cd FPVDesktopWiFiReceiver-windows-x64 && zip -qr "../FPVDesktopWiFiReceiver-${GITHUB_REF_NAME}-windows-x64.zip" .)
          chmod +x FPVDesktopWiFiReceiver-linux-x64/FPVDesktopWiFiReceiver
          tar -C FPVDesktopWiFiReceiver-linux-x64 -czf "FPVDesktopWiFiReceiver-${GITHUB_REF_NAME}-linux-x64.tar.gz" --transform "s,^\.,FPVDesktopWiFiReceiver," .
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **English** — **Windows 10/11 x64:** unzip and double-click `FPVDesktopWiFiReceiver.exe`. The first time, install the adapter's WinUSB driver from the app (File > Install adapter driver; [README](https://github.com/${{ github.repository }}/blob/main/README.md#windows-1011), step 3). **Linux x64:** binary that needs the system's Qt 6, libusb and FFmpeg (libavcodec/libavformat, for video recording), plus the udev rule from the README.

          **Español** — **Windows 10/11 x64:** descomprime y abre `FPVDesktopWiFiReceiver.exe` con doble clic. La primera vez, instala el driver WinUSB del adaptador desde la app (Archivo > Instalar driver del adaptador; [README](https://github.com/${{ github.repository }}/blob/main/README.es.md#windows-1011), paso 3). **Linux x64:** binario que necesita Qt 6, libusb y FFmpeg (libavcodec/libavformat, para grabar vídeo) del sistema, y la regla udev del README.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "FPVDesktopWiFiReceiver $GITHUB_REF_NAME" --notes-file notes.md \
            FPVDesktopWiFiReceiver-*.zip FPVDesktopWiFiReceiver-*.tar.gz
