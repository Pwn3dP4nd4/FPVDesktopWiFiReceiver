<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- FPVDesktopWiFiReceiver: un quad FPV emitiendo en 5.8 GHz. Fuente de assets/icons/* (scripts/make-icons.sh) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffc247"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#2c4a7c" stroke-width="4"/>

  <!-- ondas de video -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M108.2 88.2 A28 28 0 0 1 147.8 88.2" stroke-width="12"/>
    <path d="M92.6 72.6 A50 50 0 0 1 163.4 72.6" stroke-width="12" opacity="0.85"/>
    <path d="M77.1 57.1 A72 72 0 0 1 178.9 57.1" stroke-width="12" opacity="0.65"/>
  </g>
  <circle cx="128" cy="110" r="9" fill="#ffb03a"/>

  <!-- quad (vista superior) -->
  <g stroke="#e8eef8" stroke-linecap="round">
    <path d="M128 162 L86 204 M128 162 L170 204 M128 162 L86 120 M128 162 L170 120" stroke-width="12"/>
  </g>
  <g fill="#1d3560" stroke="#e8eef8" stroke-width="7">
    <circle cx="86" cy="120" r="23"/>
    <circle cx="170" cy="120" r="23"/>
    <circle cx="86" cy="204" r="23"/>
    <circle cx="170" cy="204" r="23"/>
  </g>
  <g fill="#e8eef8">
    <circle cx="86" cy="120" r="6"/>
    <circle cx="170" cy="120" r="6"/>
    <circle cx="86" cy="204" r="6"/>
    <circle cx="170" cy="204" r="6"/>
  </g>
  <rect x="108" y="142" width="40" height="40" rx="10" fill="#ff8a1f" stroke="#e8eef8" stroke-width="5"/>
  <circle cx="128" cy="154" r="6" fill="#0a1020"/>
</svg>
